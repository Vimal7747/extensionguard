# .github/workflows/ci.yml - Continuous integration for ExtensionGuard
#
# Runs on every push and pull request. Three parallel jobs:
#   1. test  - pytest across Python 3.10 / 3.11 / 3.12 / 3.13 on Ubuntu
#   2. lint  - ruff check + ruff format --check
#   3. build - confirm `python -m build` produces a wheel
#
# The matrix is deliberately small. Add macOS / Windows runners later if you
# start writing Windows-specific code paths (the chrome_killer.py registry
# code is Windows-only but we test it via mocks, so Ubuntu is sufficient).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when new commits arrive on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------
  # Test matrix
  # ----------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # Let other versions finish even if one fails
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest

  # ----------------------------------------------------------------------
  # Lint + format check (Python 3.13 only)
  # ----------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.5"

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        # --check fails CI if any file needs reformatting
        run: ruff format --check .

  # ----------------------------------------------------------------------
  # Build wheel
  # ----------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel + sdist
        run: python -m build

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
