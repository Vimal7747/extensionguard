# .github/workflows/live-api.yml - Weekly contract check against real APIs
#
# The normal CI run replays recorded responses. This job calls the live
# Chrome Web Store and OSV services, so an upstream change (a renamed field,
# a new required parameter, a removed query type) is caught within a week
# instead of silently turning a check into a no-op.

name: Live API contract

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  live-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run live contract tests
        env:
          EXTGUARD_LIVE_TESTS: "1"
        run: pytest -m live -v
