# .github/workflows/live-api.yml - Weekly contract check against real APIs
#
# The normal CI run replays recorded responses. This job calls the live
# Chrome Web Store and OSV services, so an upstream change (a renamed field,
# a new required parameter, a removed query type) is caught within a week
# instead of silently turning a check into a no-op. It also runs the
# behavioural monitor against the runner's real (headless) Chrome.
#
# Runs weekly, on demand, and on any PR that changes the live tests or this
# workflow - so a change to them is proven before it merges. It is not a
# required check: an outage at Google or OSV must not block unrelated PRs.

name: Live API contract

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/live-api.yml"
      - "tests/test_live_*.py"

jobs:
  live-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Chrome is available for the monitor test
        run: google-chrome --version

      - name: Run live contract tests
        env:
          EXTGUARD_LIVE_TESTS: "1"
        # -rs prints the reason for any skipped test. tests/test_live_monitor.py
        # fails (instead of skipping) when Chrome is missing on CI.
        run: pytest -m live -v -rs --junitxml=live-results.xml

      - name: Report failures as annotations
        # Job logs need a GitHub sign-in; annotations are public, so the
        # failing test and its error show on the PR and in the check-run API
        if: failure()
        run: python tools/junit_annotations.py live-results.xml
