[pytest]
# pytest config for the ExtensionGuard test suite.
# Tests live in tests/ and are auto-discovered.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Don't collect benchmark suite during normal `pytest` runs.
# Run them explicitly with: pytest tests/benchmarks/
# Or via the convenience target documented in PERFORMANCE.md
norecursedirs = tests/benchmarks

# Show short tracebacks by default - faster to scan when many tests fail.
# Override locally with `pytest --tb=long` when debugging.
addopts = --tb=short -v

# pytest-asyncio: auto-detect @pytest.mark.asyncio tests in any module so
# we don't have to opt-in per-file.
asyncio_mode = auto

# Treat warnings as errors so we catch deprecations early
filterwarnings =
    error
    ignore::DeprecationWarning:websockets.*
    ignore::PendingDeprecationWarning:pytest_asyncio.*
