# docker-compose.yml - ExtensionGuard SOC deployment
#
# Services:
#   - dashboard:  Flask analyst console at http://localhost:5000
#   - dispatcher: long-running Stage 4 dispatcher (reads alerts.jsonl, dispatches)
#   - ttp-sync:   nightly pull from the configured GitHub TTP repo (staged for review)
#   - webhook:    optional GitHub push receiver (profile "webhook")
#
# Run with:
#   docker compose up -d
#   docker compose --profile webhook up -d        # also start the webhook receiver
#
# TTP updates are staged, not live. Review and activate them with:
#   docker compose exec ttp-sync extguard-ttp-sync --status
#   docker compose exec ttp-sync extguard-ttp-sync --activate
#
# The monitor (Stage 3) is NOT in here because it has to connect to a real
# Chrome instance via CDP - that's host-bound and best run outside Docker
# on the SOC analyst's actual workstation.

services:
  # ----------------------------------------------------------------------
  # Analyst dashboard - the primary web UI for browsing cases and approving
  # remediations. Bound to 127.0.0.1 by default so the published port is only
  # reachable from the host; put it behind a reverse proxy if exposing wider.
  # ----------------------------------------------------------------------
  dashboard:
    build: .
    image: extensionguard:0.3.0
    container_name: extguard-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - quarantine:/var/lib/extguard/quarantine
      - ttp:/var/lib/extguard/ttp
      - ./extguard.conf.json:/var/lib/extguard/extguard.conf.json:ro
      - ./alerts.jsonl:/var/lib/extguard/alerts.jsonl:ro
    environment:
      - EXTGUARD_LOG_JSON=1
      - EXTGUARD_LOG_LEVEL=INFO
    command:
      - "extguard-dashboard"
      - "--host=0.0.0.0"
      - "--port=5000"
      - "--quarantine=/var/lib/extguard/quarantine"
      - "--alerts-log=/var/lib/extguard/alerts.jsonl"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------
  # Alert dispatcher - reads alerts.jsonl (typically piped from
  # behavioral_monitor on the host) and fans out to configured SIEM /
  # paging destinations.
  # ----------------------------------------------------------------------
  dispatcher:
    image: extensionguard:0.3.0
    container_name: extguard-dispatcher
    restart: unless-stopped
    depends_on:
      - dashboard
    volumes:
      - ./extguard.conf.json:/var/lib/extguard/extguard.conf.json:ro
      - ./alerts.jsonl:/var/lib/extguard/alerts.jsonl:ro
    environment:
      - EXTGUARD_LOG_JSON=1
      - EXTGUARD_LOG_LEVEL=INFO
      # Adapter credentials - source from .env file or your secrets manager
      - VT_API_KEY=${VT_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    # `tail -f` keeps the file open and streams new lines to the dispatcher.
    # Using shell so we can pipe across the container's process boundary.
    entrypoint: ["sh", "-c"]
    command:
      - "tail -F /var/lib/extguard/alerts.jsonl | extguard-dispatch"

  # ----------------------------------------------------------------------
  # Nightly TTP library sync. Re-runs extguard-ttp-sync once every 24 hours
  # to pull the latest threat intel from the configured GitHub repo into
  # ttp/library.pending. Nothing reaches Claude's prompt until an analyst
  # runs `extguard-ttp-sync --activate` (see the top of this file).
  # ----------------------------------------------------------------------
  ttp-sync:
    image: extensionguard:0.3.0
    container_name: extguard-ttp-sync
    restart: unless-stopped
    volumes:
      - ttp:/var/lib/extguard/ttp
      - ./extguard.conf.json:/var/lib/extguard/extguard.conf.json:ro
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    entrypoint: ["sh", "-c"]
    # Simple loop instead of cron - keeps the container minimal. Sleep 24h
    # then re-run the sync. First sync runs immediately on container start.
    command:
      - |
        while true; do
          extguard-ttp-sync || true
          sleep 86400
        done

  # ----------------------------------------------------------------------
  # GitHub webhook receiver (optional). Separate from the dashboard because
  # it must be reachable by GitHub while the dashboard must not be. Publish
  # it through a TLS reverse proxy or tunnel pointing at 127.0.0.1:8765.
  # ----------------------------------------------------------------------
  webhook:
    image: extensionguard:0.3.0
    container_name: extguard-webhook
    restart: unless-stopped
    profiles: ["webhook"]
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ttp:/var/lib/extguard/ttp
      - webhook_state:/var/lib/extguard/webhook
      - ./extguard.conf.json:/var/lib/extguard/extguard.conf.json:ro
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Delivery IDs (replay protection) persist in the webhook_state volume
      - EXTGUARD_HOME=/var/lib/extguard/webhook
      - EXTGUARD_CONFIG=/var/lib/extguard/extguard.conf.json
    command: ["extguard-webhook", "--host=0.0.0.0", "--port=8765"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8765/healthz', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

# Named volumes so the quarantine, TTP library and webhook state survive
# container restarts.
volumes:
  quarantine:
  ttp:
  webhook_state:
